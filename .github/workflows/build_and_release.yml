name: Build and Release Clestra APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clestra-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Clestra Release v1.0.${{ github.run_number }}
          body: |
            ### Clestra Chat APK
            Automated build for commit `${{ github.sha }}`.

            - **Decentralized P2P Messaging** (Direct node-to-node delivery when online)
            - **Serverless Offline Relay** (MongoDB Atlas free-tier storage with instant auto-cleanup)
            - **Artistic Peach UI** (Material 3 with custom peach palettes & illustrations)
            - **Unique Immutable Clestra ID** generated from account credentials
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
